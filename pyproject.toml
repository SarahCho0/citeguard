[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "0.1.0"
description = "Verification toolkit for LLM applications — deterministic citation gates, retrieval eval harness, golden-test runner. Zero LLM calls, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hyeonju Sarah Cho" }]
keywords = ["llm", "evaluation", "citation", "rag", "hallucination", "golden-test"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
demo = ["streamlit>=1.30"]

[tool.setuptools]
packages = ["citeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
